name: proposal-generation # Đặt tên gì cũng được

services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-proposal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-proposal123}
      POSTGRES_DB: ${POSTGRES_DB:-proposal_db}
    volumes:
      - proposal_postgres:/var/lib/postgresql/data
    ports:
      - 5441:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 30s
    restart: unless-stopped # Khóa server khi bi loi

  backend:
    build: ./backend
    environment:
      DATABASE_DRIVER: postgresql+asyncpg
      DB_HOST: database
      DATABASE: proposal_db
      DB_USER: ${POSTGRES_USER:-proposal}
      DB_PASS: ${POSTGRES_PASSWORD:-proposal123}
      DB_PORT: 5432
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL}
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_ORIGIN: http://localhost:3000
    depends_on:
      database:
        condition: service_healthy
    ports:
      - 8000:8000
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - 3000:3000
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  proposal_postgres:
